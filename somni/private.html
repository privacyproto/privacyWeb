    :root {

      --text: #f7f5ff;
      --secondary: #aaa8ba;
      --lavender: #c7a9ff;
      --mint: #72e0ca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: radial-gradient(circle at 90% 0%, #202044 0, var(--background) 34rem);
      color: var(--text);
      font: -apple-system-body;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      line-height: 1.62;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 18px 54px; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    select {
      appearance: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 32px 9px 12px;
      font: inherit;
      background-image: linear-gradient(45deg, transparent 50%, var(--lavender) 50%), linear-gradient(135deg, var(--lavender) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .eyebrow { color: var(--mint); font-weight: 650; font-size: .88rem; letter-spacing: .02em; }
    h1 { margin: 8px 0 6px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.12; letter-spacing: -.03em; }
    .updated { margin: 0 0 20px; color: var(--secondary); font-size: .9rem; }
    .lead { color: #d8d5e6; font-size: 1.04rem; margin-bottom: 24px; }
    section {
      margin: 14px 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(14px);
    }
    h2 { margin: 0 0 10px; font-size: 1.14rem; line-height: 1.3; }
    p { margin: 8px 0; color: #d4d1df; }
    ul { margin: 8px 0 2px; padding-inline-start: 1.35rem; color: #d4d1df; }
    li { margin: 6px 0; }
    .notice { border-color: rgba(199, 169, 255, .28); }
    .notice h2 { color: var(--lavender); }
    footer { color: var(--secondary); font-size: .86rem; padding: 18px 4px 0; text-align: center; }
    noscript { display: block; margin: 24px; color: var(--text); }

    const languageSelect = document.getElementById("language");
    const supported = Object.keys(policies);

    function preferredLanguage() {
      const requested = navigator.languages || [navigator.language || "en"];
      for (const item of requested) {
        const value = String(item).toLowerCase();
        if (value.startsWith("zh-hant") || value.startsWith("zh-tw") || value.startsWith("zh-hk") || value.startsWith("zh-mo")) return "zh-Hant";
        if (value.startsWith("zh")) return "zh-Hans";
        const base = value.split("-")[0];
        if (supported.includes(base)) return base;
      }
      return "en";
    }

    function addTextElement(parent, tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      parent.appendChild(element);
    }

    function render(language) {
      const copy = policies[language] || policies.en;
      document.documentElement.lang = language;
      document.getElementById("languageLabel").textContent = copy.languageLabel;
      document.getElementById("eyebrow").textContent = copy.eyebrow;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("updated").textContent = copy.updated;
      document.getElementById("lead").textContent = copy.lead;
      document.getElementById("footer").textContent = copy.footer;
      languageSelect.value = language;

      const container = document.getElementById("sections");
      container.replaceChildren();
      for (const item of copy.sections) {
        const section = document.createElement("section");
        if (item.notice) section.className = "notice";
        addTextElement(section, "h2", item.title);
        for (const paragraph of item.paragraphs || []) addTextElement(section, "p", paragraph);
        if (item.bullets) {
          const list = document.createElement("ul");
          for (const bullet of item.bullets) addTextElement(list, "li", bullet);
          section.appendChild(list);
        }
        container.appendChild(section);
      }
      document.getElementById("policy").hidden = false;
    }

    languageSelect.addEventListener("change", event => render(event.target.value));
    render(preferredLanguage());
  </script>
